name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, intl, zip, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install dependencies and initialize Laravel
        run: sh scripts/setup.sh
      - name: Run Laravel and Scrapling integration tests
        run: php artisan test
      - name: Run scraper URL policy tests
        run: .venv/bin/python -m unittest discover -s tests/Python
